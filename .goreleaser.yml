# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 4

project_name: codefall

builds:
  - id: codefall
    main: ./cli/cmd/codefall
    binary: codefall
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

checksum:
  name_template: "checksums.txt"
