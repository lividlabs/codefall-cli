# The encoded layer rule — see ADR-GO-02. This file is generated for this project, not copied from a
# template: depguard's allow/deny lists are literal prefix matches with no glob support, so every
# component's own import paths have to be named here.
#
# Components: doctor, initcmd. Shared modules: internal/shared/ui, internal/shared/process. The layer
# rules were proven against a deliberate Cobra import from `application/` on 2026-08-27 — from
# doctor's when they were written, and from initcmd's when it was added — and re-proven the same day
# against an `internal/shared/ui` import from `internal/initcmd/internal/application/` and from
# `internal/doctor/internal/domain/`. The `shared-modules` rule was proven on 2026-08-27, once per
# deny entry.
#
# Proving `shared-modules` needs a throwaway package: a real shared module imports a component only
# in a build that already has an import cycle, and a cycle is a compile error rather than the lint
# failure ADR-GO-02 asks for. Add `internal/shared/proof/` importing a component's facade, confirm
# `go build ./...` passes and `golangci-lint run` fails on this rule, and delete it.
#
# ADDING A COMPONENT: add an `application-layer` allow entry for its `internal/domain` package, and a
# `shared-modules` deny entry for its facade. Without the first, its application/ layer silently
# loses access to its own domain/.
version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # Rule 2 (inward only) + rule 5 (no transport, no storage) for the innermost ring.
        domain-layer:
          list-mode: strict
          files:
            - "**/internal/domain/**"
          allow:
            - $gostd
            - github.com/samber/mo
          deny:
            - pkg: net
              desc: "domain/ names no transport (ADR-GO-02 rule 5)"
            - pkg: database/sql
              desc: "domain/ names no storage (ADR-GO-02 rule 5)"
            - pkg: os
              desc: "domain/ does no IO (ADR-BASE-01)"
            - pkg: github.com/spf13/
              desc: "domain/ names no CLI framework — Cobra, pflag (ADR-GO-02 rule 5, ADR-002)"
            - pkg: github.com/charmbracelet/
              desc: "domain/ names no CLI framework — Fang and Charm helpers (ADR-GO-02 rule 5, ADR-002)"
            - pkg: charm.land/
              desc: "domain/ names no CLI framework — Charm v2 libraries (ADR-GO-02 rule 5, ADR-002)"

        # Same, plus each component's own domain/ — and nothing else, so an outward import of
        # infrastructure/ or presentation/ fails while still compiling. One allow entry per
        # component.
        application-layer:
          list-mode: strict
          files:
            - "**/internal/application/**"
          allow:
            - $gostd
            - github.com/samber/mo
            - github.com/lividlabs/codefall-cli/internal/doctor/internal/domain
            - github.com/lividlabs/codefall-cli/internal/initcmd/internal/domain
          deny:
            - pkg: net
              desc: "application/ names no transport (ADR-GO-02 rule 5)"
            - pkg: database/sql
              desc: "application/ names no storage (ADR-GO-02 rule 5)"
            - pkg: github.com/spf13/
              desc: "application/ names no CLI framework — Cobra, pflag (ADR-GO-02 rule 5, ADR-002)"
            - pkg: github.com/charmbracelet/
              desc: "application/ names no CLI framework — Fang and Charm helpers (ADR-GO-02 rule 5, ADR-002)"
            - pkg: charm.land/
              desc: "application/ names no CLI framework — Charm v2 libraries (ADR-GO-02 rule 5, ADR-002)"

        # Rule 4 — shared modules are one-way; components may import them, never the reverse. One
        # deny entry per component.
        shared-modules:
          files:
            - "**/internal/shared/**"
          deny:
            - pkg: github.com/lividlabs/codefall-cli/internal/doctor
              desc: "shared modules must not import components (ADR-GO-02 rule 4)"
            - pkg: github.com/lividlabs/codefall-cli/internal/initcmd
              desc: "shared modules must not import components (ADR-GO-02 rule 4)"

# gofmt as a rule the linter enforces, not a habit. golangci-lint v2 runs formatters as their own
# stage, and `golangci-lint run` fails on a file that gofmt would rewrite. Proven on 2026-08-27
# against a deliberately misindented function body.
formatters:
  enable:
    - gofmt
