name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        
        run: go build ./...

      - name: Vet
        
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          
          args: --timeout 5m

      - name: Test

        run: go test ./...

      - name: Skill health
        # Reports every skill against ADR-004's guidelines. Add --strict once every skill is inside them.
        run: extensions/scripts/skill-health.sh
