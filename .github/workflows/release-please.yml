name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below runs only on the push that actually cuts a release —
      # the merge of the release PR. Ordinary merges to main leave the pin alone,
      # which is what makes a release gate what installs receive.
      #
      # `release_created` and `sha` are ROOT-COMPONENT outputs, available only
      # because release-please-config.json keeps the package path at ".". Moving
      # that package to plugins/codefall would rename them to
      # `plugins/codefall--release_created` and `plugins/codefall--sha`; these
      # references would then evaluate empty, the steps would silently skip, and
      # the pin would quietly stop advancing. Change both together or neither.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: main

      # This goes through a pull request rather than pushing to main, because the
      # "Main Branch Rules" ruleset requires it and github-actions[bot] is not in
      # its bypass list. The PR rule requires zero approvals and there are no
      # required checks, so the same step can merge it — no auto-merge setting
      # and no PAT needed.
      - name: Pin the marketplace entry to the released commit
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          jq --arg sha "$RELEASE_SHA" \
            '(.plugins[] | select(.name == "codefall") | .source.sha) = $sha' \
            .claude-plugin/marketplace.json > marketplace.json.tmp
          mv marketplace.json.tmp .claude-plugin/marketplace.json

          if git diff --quiet -- .claude-plugin/marketplace.json; then
            echo "marketplace already pinned to $RELEASE_SHA"
            exit 0
          fi

          BRANCH="chore/pin-marketplace-${TAG_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore: pin marketplace to ${TAG_NAME}"
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "chore: pin marketplace to ${TAG_NAME}" \
            --body "Points the \`codefall\` marketplace entry at \`${RELEASE_SHA}\`, the commit tagged \`${TAG_NAME}\`. Opened by the release workflow. Until it merges, installs track \`main\` rather than the release."

          # Mergeability is computed asynchronously; give GitHub a moment.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then
              exit 0
            fi
            echo "merge attempt $attempt failed, retrying"
            sleep 5
          done
          echo "::error::could not merge the pin PR for ${TAG_NAME}; merge it by hand"
          exit 1
